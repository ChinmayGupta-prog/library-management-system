<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Loans')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="page">
    <div class="toolbar">
        <div>
            <p class="eyebrow">Circulation</p>
            <h1>Loans and returns</h1>
        </div>
        <a class="btn primary" th:href="@{/loans/new}"><span class="material-icons-round">ios_share</span>Issue Book</a>
    </div>
    <div th:replace="~{fragments :: alerts}"></div>
    <div class="table-wrap">
        <table>
            <thead><tr><th>Book</th><th>Member</th><th>Issued</th><th>Due</th><th>Status</th><th></th></tr></thead>
            <tbody>
            <tr th:each="loan : ${loans}">
                <td><span th:text="${loan.book.title}">Book</span><small th:text="${loan.book.author != null ? loan.book.author.name : 'Unknown'}">Author</small></td>
                <td th:text="${loan.member.fullName}">Member</td>
                <td th:text="${loan.issuedOn}">Issued</td>
                <td th:text="${loan.dueOn}">Due</td>
                <td><span class="chip" th:text="${loan.status}">ACTIVE</span></td>
                <td>
                    <form th:if="${loan.status.name() == 'ACTIVE'}" th:action="@{/loans/{id}/return(id=${loan.id})}" method="post">
                        <button class="btn secondary compact-btn" type="submit"><span class="material-icons-round">assignment_return</span>Return</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<script th:replace="~{fragments :: scripts}"></script>
</body>
</html>
