<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | Lumina LMS'">Lumina LMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav th:fragment="navbar" class="topbar">
    <a class="brand" th:href="@{/}" aria-label="Lumina Library home">
        <span class="brand-mark"><span class="material-icons-round">auto_stories</span></span>
        <span>
            <strong>Lumina</strong>
            <small>Library Management</small>
        </span>
    </a>
    <button class="nav-toggle" type="button" aria-label="Open navigation">
        <span class="material-icons-round">menu</span>
    </button>
    <div class="nav-links">
        <a th:href="@{/}"><span class="material-icons-round">dashboard</span>Home</a>
        <a th:href="@{/books}"><span class="material-icons-round">local_library</span>Books</a>
        <a th:href="@{/members}"><span class="material-icons-round">groups</span>Members</a>
        <a th:href="@{/loans}"><span class="material-icons-round">assignment_return</span>Loans</a>
        <a th:href="@{/categories}"><span class="material-icons-round">category</span>Categories</a>
    </div>
</nav>

<div th:fragment="alerts">
    <div class="alert success" th:if="${success}">
        <span class="material-icons-round">check_circle</span>
        <span th:text="${success}">Success</span>
    </div>
    <div class="alert error" th:if="${error}">
        <span class="material-icons-round">error</span>
        <span th:text="${error}">Error</span>
    </div>
</div>

<script th:fragment="scripts" th:src="@{/js/app.js}"></script>
</body>
</html>
